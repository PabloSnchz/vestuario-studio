<!DOCTYPE html>
<html lang="es" data-theme="cereza">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vestuario Studio — Chantal Aiello</title>
  <meta name="description" content="Sistema de gestión de vestuario, alumnas y cobranza para el Estudio de Arte Chantal Aiello.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>

  <header class="app-header" role="banner">
    <div class="app-header__brand">
      <span class="app-header__logo">Vestuario Studio</span>
      <span class="app-header__subtitle">Estudio de Arte Chantal Aiello</span>
    </div>
    <div class="app-header__actions">
      <div class="app-header__field">
        <label class="app-header__field-label" for="tema-selector">Tema</label>
        <select id="tema-selector" class="input input--select" aria-label="Tema visual">
          <option value="cereza">Cereza</option>
          <option value="oliva">Oliva</option>
          <option value="terracota">Terracota</option>
          <option value="grafito">Grafito</option>
        </select>
      </div>
      <div class="app-header__field">
        <label class="app-header__field-label" for="evento-selector">Evento activo</label>
        <select id="evento-selector" class="input input--select" aria-label="Seleccionar evento activo"></select>
      </div>
      <a href="#/guia" id="btn-guia" class="btn btn--ghost btn--small" type="button" title="Guia de uso"><span data-icon="book" style="display:inline-flex;width:14px;height:14px"></span> Guia</a>
      <button id="btn-token" class="btn btn--ghost btn--small" type="button">Configurar token</button>
      <button id="btn-backup" class="btn btn--secondary btn--small" type="button" style="display:none" title="Guardar cambios en GitHub">Backup a GitHub</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="app-drawer" aria-label="Navegación principal">
      <nav>
        <ul class="app-drawer__list">
          <li><a href="#/dashboard" data-route="dashboard" class="app-drawer__link"><span class="app-drawer__icon" data-icon="dashboard"></span><span>Dashboard</span></a></li>
          <li><a href="#/alumnas"   data-route="alumnas"   class="app-drawer__link"><span class="app-drawer__icon" data-icon="users"></span><span>Alumnas</span></a></li>
          <li><a href="#/disenos"   data-route="disenos"   class="app-drawer__link"><span class="app-drawer__icon" data-icon="shirt"></span><span>Diseños</span></a></li>
          <li><a href="#/eventos"   data-route="eventos"   class="app-drawer__link"><span class="app-drawer__icon" data-icon="calendar"></span><span>Eventos</span></a></li>
          <li><a href="#/pagos"     data-route="pagos"     class="app-drawer__link"><span class="app-drawer__icon" data-icon="money"></span><span>Pagos</span></a></li>
          <li><a href="#/reportes"  data-route="reportes"  class="app-drawer__link"><span class="app-drawer__icon" data-icon="chart"></span><span>Reportes</span></a></li>
          <li><a href="#/catalogos" data-route="catalogos" class="app-drawer__link"><span class="app-drawer__icon" data-icon="settings"></span><span>Catalogos</span></a></li>
        </ul>
      </nav>
    </aside>

    <main class="app-main" role="main">
      <nav class="breadcrumbs" aria-label="Ruta de navegación">
        <ol id="breadcrumbs-list" class="breadcrumbs__list"></ol>
      </nav>

      <section id="view-container" class="view-container" aria-live="polite">
        <!-- Las vistas se renderizan acá -->
      </section>
    </main>
  </div>

  <button id="fab" class="fab" type="button" hidden aria-label="Acción principal"></button>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
